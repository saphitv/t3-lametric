[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t3-lametric"
version = "0.8.5"
description = "Provider-independent T3 Code activity and usage on a LaMetric Time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websocket-client>=1.9,<2"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]

[project.urls]
Repository = "https://git.cafe/saphitv/t3-lametric"
GitHub = "https://github.com/saphitv/t3-lametric"

[project.scripts]
t3-lametric = "t3_lametric.cli:main"

[tool.setuptools.packages.find]
include = ["t3_lametric*"]

[tool.setuptools.package-data]
t3_lametric = ["assets/*.png"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
